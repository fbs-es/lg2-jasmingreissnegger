  assemblies:
  - Radiosendung
  namespace: Fbs.Lg2
  summary: >-
    Optional advanced: inserts the emergency announcement at the current running position.

    The currently playing contribution is split into two parts:
      - the first part (up to the announcement's start) stays in the schedule
      - the remaining rest is added as a NEW contribution right after the announcement.
  example: []
  syntax:
